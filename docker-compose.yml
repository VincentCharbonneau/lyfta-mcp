services:
  lyfta-mcp:
    build: .
    image: lyfta-mcp:local
    restart: unless-stopped
    ports:
      # Bound to localhost: put a TLS reverse proxy (Caddy, nginx, ...) in front.
      # Use "8000:8000" only if the proxy runs on another machine.
      - "127.0.0.1:8000:8000"
    # LYFTA_API_KEY and MCP_AUTH_TOKEN (required), LOG_LEVEL (optional). See .env.example.
    env_file: .env
